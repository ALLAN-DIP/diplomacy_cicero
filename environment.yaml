name: base
prefix: /usr/local
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Install go for boringssl in grpc
  - go=1.23.6
  # We have some hacky patching code for protobuf that is not guaranteed
  # to work on versions other than this.
  - protobuf=3.19.1
  - pybind11=2.13.6
  # Other requirements
  - python=3.10
  - pytorch=2.5.1
  - torchaudio=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.4